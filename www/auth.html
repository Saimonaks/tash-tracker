<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Вход и регистрация — Трекинг целей и задач с напоминанием</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="site-header">
    <a class="logo" href="index.html">Трекинг целей и задач</a>
    <nav aria-label="Основная навигация">
      <ul class="nav-list">
        <li><a class="nav-link" href="tasks.html">Задачи</a></li>
        <li><a class="nav-link" href="goals.html">Цели</a></li>
        <li><a class="nav-link" href="teams.html">Команды</a></li>
        <li><a class="nav-link" href="profile.html">Профиль</a></li>
        <li><a class="nav-link" href="auth.html#login" aria-current="page">Вход</a></li>
        <li><a class="nav-link" href="auth.html#register">Регистрация</a></li>
      </ul>
    </nav>
  </header>

  <main class="container">
    <h1>Вход и регистрация</h1>

    <div class="auth-grid">
      <section class="card" id="login">
        <h2>Вход</h2>
        <form action="#" method="post">
          <div class="form-group">
            <label for="login-email">Email:</label>
            <input class="form-control" type="email" id="login-email" name="email" required>
          </div>

          <div class="form-group">
            <label for="login-password">Пароль:</label>
            <input class="form-control" type="password" id="login-password" name="password" required>
          </div>

          <div class="button-row">
            <button class="btn btn-primary" type="submit">Войти</button>
            <button class="btn" type="button">Забыли пароль?</button>
          </div>
        </form>
      </section>

      <section class="card" id="register">
        <h2>Регистрация</h2>
        <form action="#" method="post">
          <div class="form-group">
            <label for="register-email">Email:</label>
            <input class="form-control" type="email" id="register-email" name="email" required>
          </div>

          <div class="form-group">
            <label for="register-password">Пароль:</label>
            <input class="form-control" type="password" id="register-password" name="password" required>
          </div>

          <div class="button-row">
            <button class="btn btn-primary" type="submit">Зарегистрироваться</button>
          </div>
        </form>
      </section>

      <section class="card" id="password-recovery">
        <h2>Восстановление пароля</h2>
        <form action="#" method="post">
          <div class="form-group">
            <label for="recovery-email">Email:</label>
            <input class="form-control" type="email" id="recovery-email" name="email" required>
          </div>

          <div class="button-row">
            <button class="btn btn-primary" type="submit">Восстановить пароль</button>
            <button class="btn" type="button">Закрыть</button>
          </div>
        </form>
      </section>
    </div>
  </main>

  <footer class="site-footer">
    <nav aria-label="Служебная навигация">
      <ul class="nav-list">
        <li><a class="nav-link" href="tasks.html">Задачи</a></li>
        <li><a class="nav-link" href="teams.html">Команды</a></li>
        <li><a class="nav-link" href="error.html">Справка и диагностика ошибок</a></li>
      </ul>
    </nav>
  </footer>
</body>
</html>
